services:
  mysql:
    image: mysql:8.4
    container_name: draw_wall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-yu_picture}
    ports:
      - "3306:3306"
    volumes:
      - draw_wall_mysql:/var/lib/mysql
      - ./yu-picture-backend/sql/create_table.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: draw_wall-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - draw_wall_redis:/data
volumes:
  draw_wall_mysql:
  draw_wall_redis:
